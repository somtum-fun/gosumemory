name: Build and Archive

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install MinGW
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 gcc-mingw-w64-i686

      - name: Clone static repository
        run: git clone --depth 1 https://github.com/l3lackShark/static

      - name: Test
        run: go vet ./mem ./memory ./pp && (cd pp && go test ./...)

      - name: Build for Windows amd64
        run: mkdir -p out/windows_amd64 && CC=x86_64-w64-mingw32-gcc CGO_ENABLED=1 GOOS=windows GOARCH=amd64 go build -o out/windows_amd64/gosumemory.exe && cp -r static out/windows_amd64/

      - name: Build for Windows 386
        run: mkdir -p out/windows_386 && CC=i686-w64-mingw32-gcc CGO_ENABLED=1 GOOS=windows GOARCH=386 go build -o out/windows_386/gosumemory.exe && cp -r static out/windows_386/

      - name: Build for Linux amd64
        run: mkdir -p out/linux_amd64 && go build -o out/linux_amd64/gosumemory && cp -r static out/linux_amd64/

      - uses: actions/upload-artifact@v4
        with:
          name: gosumemory_windows_amd64
          path: out/windows_amd64

      - uses: actions/upload-artifact@v4
        with:
          name: gosumemory_windows_386
          path: out/windows_386

      - uses: actions/upload-artifact@v4
        with:
          name: gosumemory_linux_amd64
          path: out/linux_amd64
